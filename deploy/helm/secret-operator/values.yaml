# Default values for secret-operator.
---
# Used by both the Controller Service and Node Service containers
image:
  # Registry and namespace holding the operator image, without the image name.
  # Set when the chart is packaged, from the registry it is published to, so it is
  # normally already correct. Override it to pull from a mirror.
  # repository: oci.stackable.tech/sdp

  # Overrides the operator image tag, which defaults to the chart appVersion.
  # tag: 0.0.0-dev

  pullPolicy: IfNotPresent
  pullSecrets: []

controllerService:
  podAnnotations: {}
  podSecurityContext: {}
    # fsGroup: 2000
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # PriorityClass for the controller pod. Unset means the cluster default.
  # priorityClassName: system-cluster-critical

  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 100m
      memory: 128Mi

  securityContext:
    # secret-operator requires root permissions
    runAsUser: 0
    # capabilities:
    #   drop:
    #   - ALL
    # readOnlyRootFilesystem: true
    # runAsNonRoot: true
    # runAsUser: 1000

csiNodeDriver:
  # Kubelet dir may vary in environments such as microk8s.
  # See https://github.com/stackabletech/secret-operator/issues/229
  kubeletDir: /var/lib/kubelet

  podAnnotations: {}
  podSecurityContext: {}
    # fsGroup: 2000
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # PriorityClass for the node driver pods. Unset means the cluster default.
  # priorityClassName: system-node-critical

  nodeService:
    resources:
      limits:
        cpu: 100m
        memory: 128Mi
      requests:
        cpu: 100m
        memory: 128Mi

    securityContext:
      # secret-operator requires root permissions
      runAsUser: 0
      # It is strongly recommended to run secret-operator as a privileged container, since
      # it enables additional protections for the secret contents.
      # Unprivileged mode is EXPERIMENTAL and requires manual migration for an existing cluster.
      privileged: true
      # capabilities:
      #   drop:
      #   - ALL
      # readOnlyRootFilesystem: true
      # runAsNonRoot: true
      # runAsUser: 1000

  externalProvisioner:
    image:
      # Registry and namespace holding the sidecar image. Defaults to image.repository
      # with /sig-storage appended. Override it to pull from a mirror.
      # repository: oci.stackable.tech/sdp/sig-storage
      tag: v5.3.0
      pullPolicy: IfNotPresent
      # NOTE (@Techassi): Support setting pullSecrets
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi

  nodeDriverRegistrar:
    image:
      # Registry and namespace holding the sidecar image. Defaults to image.repository
      # with /sig-storage appended. Override it to pull from a mirror.
      # repository: oci.stackable.tech/sdp/sig-storage
      tag: v2.15.0
      pullPolicy: IfNotPresent
      # NOTE (@Techassi): Support setting pullSecrets
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # Leave empty to use the generated name, <release>-secret-operator-serviceaccount.
  # Required when create is false, so that the workloads and the ClusterRoleBinding
  # know which existing service account to use.
  name: ""

# Provide additional labels which get attached to all deployed resources
labels:
  stackable.tech/vendor: Stackable

# Customize default custom resources deployed by the operator
secretClasses:
  tls:
    # The namespace that the TLS Certificate Authority is installed into.
    # Defaults to the namespace where secret-op is installed.
    caSecretNamespace: null

# When running on a non-default Kubernetes cluster domain, the cluster domain can be configured here.
# See the https://docs.stackable.tech/home/stable/guides/kubernetes-cluster-domain guide for details.
# kubernetesClusterDomain: my-cluster.local

maintenance:
  endOfSupportCheck:
    enabled: true
    # mode: offline
    # interval: 24h

  customResourceDefinitions:
    maintain: true

# See all available options and detailed explanations about the concept here:
# https://docs.stackable.tech/home/stable/concepts/telemetry/
telemetry:
  consoleLog:
    enabled: true
  fileLog:
    enabled: false
    rotationPeriod: hourly
    maxFiles: 6
  otelLogExporter:
    enabled: false
  otelTraceExporter:
    enabled: false
